name: Feature request
description: Suggest a capability or an improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please check [docs/PLAN.md](../blob/main/docs/PLAN.md) first — a lot of
        the obvious gaps are already planned, and it may be more useful to
        comment on the existing item.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that Archyne makes hard or impossible?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
      description: Including other tools, and what they get right.
