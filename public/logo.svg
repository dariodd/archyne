<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Archyne">
  <title>Archyne</title>
  <defs>
    <linearGradient id="arch" x1="24" y1="216" x2="220" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8B5CF6" />
      <stop offset="0.5" stop-color="#5F6BF2" />
      <stop offset="1" stop-color="#2B93FF" />
    </linearGradient>
    <linearGradient id="cubeTop" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#7B95FF" />
      <stop offset="1" stop-color="#5470F2" />
    </linearGradient>
    <linearGradient id="cubeLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B4CD4" />
      <stop offset="1" stop-color="#2F3CB4" />
    </linearGradient>
    <linearGradient id="cubeRight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5480F0" />
      <stop offset="1" stop-color="#3F63DA" />
    </linearGradient>
  </defs>

  <!-- The A as a gateway: vertical legs, a broad rounded shoulder, open at
       the foot. Outer contour up and over, inner contour back down — a
       single closed path, so the counter is the arch's own opening. -->
  <path
    fill="url(#arch)"
    d="M22 212
       L22 118
       Q22 108 29 100
       L107 23
       Q120 11 133 23
       L211 100
       Q218 108 218 118
       L218 212
       Q218 220 210 220
       L178 220
       Q170 220 170 212
       L170 128
       Q170 122 165 117
       L126 79
       Q120 73 114 79
       L75 117
       Q70 122 70 128
       L70 212
       Q70 220 62 220
       L30 220
       Q22 220 22 212
       Z" />

  <!-- Module: an isometric cube seated in the opening. -->
  <path fill="url(#cubeTop)" d="M120 150 L147 165 L120 180 L93 165 Z" />
  <path fill="url(#cubeLeft)" d="M93 165 L120 180 L120 212 L93 197 Z" />
  <path fill="url(#cubeRight)" d="M147 165 L120 180 L120 212 L147 197 Z" />
</svg>
